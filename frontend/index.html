<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>House Price Predictor</title>

    body { font-family: Arial; max-width: 550px; margin: 30px auto; }
    input, select, button { width: 100%; padding: 10px; margin: 6px 0; }
    .card { border: 1px solid #ddd; padding: 16px; border-radius: 10px; }

  <style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 15px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
  }

  label {
    font-weight: 600;
    font-size: 14px;
    color: #555;
  }

  input, select {
    width: 100%;
    padding: 10px;
    margin: 6px 0 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    transition: 0.2s;
  }

  input:focus, select:focus {
    border-color: #667eea;
    box-shadow: 0 0 5px rgba(102,126,234,0.5);
  }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }

  #result {
    text-align: center;
    margin-top: 15px;
    color: #222;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .card {
      margin: 15px;
      padding: 20px;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <h2>🏠 House Price Predictor</h2>

    <label>Area</label>
    <input id="area" type="number" placeholder="Area" value="5000">
    <label>Bedrooms</label>
    <input id="bedrooms" type="number" placeholder="Bedrooms" value="3">
    <label>Bathrooms</label>
    <input id="bathrooms" type="number" placeholder="Bathrooms" value="2">
    <label>Stories</label>
    <input id="stories" type="number" placeholder="Stories" value="1">
    <label>Parking</label>
    <input id="parking" type="number" placeholder="Parking" value="1">

    <label>Mainroad</label>
    <select id="mainroad"><option>yes</option><option>no</option></select>

    <label>Guestroom</label>
    <select id="guestroom"><option>yes</option><option>no</option></select>

    <label>Basement</label>
    <select id="basement"><option>yes</option><option>no</option></select>

    <label>Hotwaterheating</label>
    <select id="hotwaterheating"><option>yes</option><option>no</option></select>

    <label>Airconditioning</label>
    <select id="airconditioning"><option>yes</option><option>no</option></select>

    <label>Prefarea</label>
    <select id="prefarea"><option>yes</option><option>no</option></select>

    <label>Furnishing</label>
    <select id="furnishingstatus">
      <option value="unfurnished">unfurnished</option>
      <option value="semi-furnished">semi-furnished</option>
      <option value="furnished">furnished</option>
    </select>

    <button onclick="predict()">Predict</button>
    <h3 id="result"></h3>
  </div>

  <script>
    async function predict() {
      const payload = {
        area: Number(area.value),
        bedrooms: Number(bedrooms.value),
        bathrooms: Number(bathrooms.value),
        stories: Number(stories.value),
        parking: Number(parking.value),
        mainroad: mainroad.value,
        guestroom: guestroom.value,
        basement: basement.value,
        hotwaterheating: hotwaterheating.value,
        airconditioning: airconditioning.value,
        prefarea: prefarea.value,
        furnishingstatus: furnishingstatus.value
      };

      const res = await fetch("https://house-price-deploy.onrender.com/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      result.innerText = "Predicted Price: " + Math.round(data.predicted_price).toLocaleString();
    }
  </script>
</body>
</html>
